<script>
  /* Marks the document as script-enabled so the scroll-reveal animation is
     only ever applied when there is JavaScript able to undo it. Without
     this flag the revealed blocks would stay invisible for anyone browsing
     without JavaScript. The timer is a safety net: if the reveal script
     fails to run, the content is shown anyway. */
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    window.__bpRevealFallback = window.setTimeout(function () {
      d.classList.add('reveal-off');
    }, 2000);
  })();
</script>
