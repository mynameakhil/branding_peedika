<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Packaging and label concept for a sample spice brand">
  <rect width="1200" height="900" fill="#EDE6D9"/>
