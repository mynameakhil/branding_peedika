  <rect x="0" y="866" width="1200" height="34" fill="#3A2A20"/>
  <text x="40" y="888" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" letter-spacing="2.5" fill="#C9962F" font-weight="700">SAMPLE CONCEPT — NOT CLIENT WORK</text>
