    <rect x="20" y="140" width="150" height="42" rx="4" fill="#EDE6D9"/>
    <g fill="#6E5F51">
      <rect x="30" y="150" width="4" height="24"/><rect x="36" y="150" width="2" height="24"/><rect x="40" y="150" width="6" height="24"/>
      <rect x="50" y="150" width="3" height="24"/><rect x="56" y="150" width="5" height="24"/><rect x="64" y="150" width="2" height="24"/>
      <rect x="70" y="150" width="6" height="24"/><rect x="80" y="150" width="3" height="24"/><rect x="86" y="150" width="4" height="24"/>
