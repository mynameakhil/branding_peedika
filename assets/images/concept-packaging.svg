  </g>

  <!-- pouch 3 -->
  <g transform="translate(680,180)">
    <path d="M20 40 h200 l-14 490 h-172 z" fill="#4F6B3A"/>
    <path d="M20 40 h200 l-4 60 h-192 z" fill="#40592E"/>
