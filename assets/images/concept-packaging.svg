    <text x="120" y="352" text-anchor="middle" font-size="10" fill="#6E5F51">100 g</text>
  </g>

  <!-- pouch 2 -->
  <g transform="translate(400,240)">
    <path d="M20 40 h200 l-14 430 h-172 z" fill="#C9962F"/>
    <path d="M20 40 h200 l-4 60 h-192 z" fill="#AC7D1E"/>
