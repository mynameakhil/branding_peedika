    <line x1="66" y1="270" x2="174" y2="270" stroke="#C9962F" stroke-width="1.5"/>
    <text x="120" y="294" text-anchor="middle" font-size="9" letter-spacing="3.5" fill="#7A6A5B">PEPPER</text>
