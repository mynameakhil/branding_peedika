<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Promotional poster concept for a sample reading series">
  <rect width="1200" height="900" fill="#0B1930"/>
  <circle cx="600" cy="430" r="300" fill="#142B4A"/>
  <circle cx="600" cy="430" r="228" fill="none" stroke="#F2B544" stroke-width="1.5"/>
  <g stroke="#F2B544" stroke-width="1" opacity="0.35">
    <line x1="600" y1="130" x2="600" y2="180"/>
    <line x1="600" y1="680" x2="600" y2="730"/>
    <line x1="300" y1="430" x2="350" y2="430"/>
    <line x1="850" y1="430" x2="900" y2="430"/>
  </g>

  <g font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="240" font-size="15" letter-spacing="7" fill="#F2B544">A READING SERIES</text>
    <text x="600" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#FFFFFF" letter-spacing="1">The Coconut</text>
    <text x="600" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#FFFFFF" letter-spacing="1">Library</text>
    <line x1="540" y1="430" x2="660" y2="430" stroke="#F2B544" stroke-width="2"/>
    <text x="600" y="470" font-size="17" fill="#C9D3E0">Six coastal stories, told in Malayalam</text>
    <text x="600" y="498" font-size="17" fill="#C9D3E0">and in translation</text>
    <text x="600" y="556" font-size="13" letter-spacing="4" fill="#8FA0B4">FORT KOCHI · 12–28 FEBRUARY</text>
  </g>

  <!-- palm motif -->
  <g transform="translate(556,600)" fill="none" stroke="#F2B544" stroke-width="1.6" opacity="0.85">
    <path d="M44 90 V30"/>
    <path d="M44 40 q-30-6-38-30 q30 2 38 30z"/>
    <path d="M44 40 q30-6 38-30 q-30 2-38 30z"/>
    <path d="M44 58 q-30-4-40-26 q30 4 40 26z"/>
    <path d="M44 58 q30-4 40-26 q-30 4-40 26z"/>
  </g>

  <g font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="760" font-size="12" letter-spacing="5" fill="#8FA0B4">ENTRANCE BY INVITATION · FREE</text>
  </g>

  <rect x="0" y="866" width="1200" height="34" fill="#0B1930"/>
  <text x="40" y="888" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" letter-spacing="2.5" fill="#F2B544" font-weight="700">SAMPLE CONCEPT — NOT CLIENT WORK</text>
  <text x="1160" y="888" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#8FA0B4">Branding Peedika · concept 05</text>
</svg>
